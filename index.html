```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kuis 5 Nomor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-lg bg-white rounded-2xl shadow-2xl overflow-hidden transition-all duration-300">
        
        <!-- Welcome Screen -->
        <div id="welcome-screen" class="p-8 text-center">
            <div class="mb-6 inline-flex p-4 bg-indigo-50 rounded-full text-indigo-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Kuis Pengetahuan Umum</h1>
            <p class="text-gray-600 mb-6">Uji wawasanmu dengan menjawab 5 pertanyaan pilihan ganda yang menarik!</p>
            <button onclick="startQuiz()" class="w-full py-3 px-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg transition-transform transform active:scale-95">
                Mulai Kuis
            </button>
        </div>

        <!-- Quiz Screen (Hidden by default) -->
        <div id="quiz-screen" class="hidden p-6 sm:p-8">
            <!-- Header Progress -->
            <div class="flex justify-between items-center mb-6">
                <span id="question-counter" class="text-sm font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">Pertanyaan 1 dari 5</span>
                <span id="score-tracker" class="text-sm font-medium text-gray-500">Skor: 0</span>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 h-2 rounded-full mb-6 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 20%;"></div>
            </div>

            <!-- Question Box -->
            <h2 id="question-text" class="text-lg sm:text-xl font-bold text-gray-800 mb-6"></h2>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Options injected via JavaScript -->
            </div>

            <!-- Next Button -->
            <button id="next-btn" onclick="nextQuestion()" class="w-full py-3 px-6 bg-gray-200 text-gray-400 font-semibold rounded-xl transition-all cursor-not-allowed" disabled>
                Lanjut
            </button>
        </div>

        <!-- Result Screen (Hidden by default) -->
        <div id="result-screen" class="hidden p-8 text-center">
            <div class="mb-6 inline-flex p-4 bg-green-50 rounded-full text-green-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Kuis Selesai!</h2>
            <p class="text-gray-600 mb-4">Terima kasih telah berpartisipasi.</p>
            <div class="text-4xl font-extrabold text-indigo-600 mb-6" id="final-score">0 / 5</div>
            <p id="result-message" class="text-gray-700 font-medium mb-8"></p>
            <button onclick="restartQuiz()" class="w-full py-3 px-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg transition-transform transform active:scale-95">
                Ulangi Kuis
            </button>
        </div>

    </div>

    <script>
        // Data Pertanyaan Kuis
        const quizData = [
            {
                question: "Ibu kota negara Indonesia saat ini adalah...",
                options: ["Surabaya", "Bandung", "Jakarta", "Medan"],
                answer: 2
            },
            {
                question: "Planet apa yang dikenal sebagai Planet Merah di tata surya?",
                options: ["Venus", "Mars", "Jupiter", "Saturnus"],
                answer: 1
            },
            {
                question: "Berapa hasil dari 8 dikali 7?",
                options: ["54", "56", "64", "48"],
                answer: 1
            },
            {
                question: "Siapa penemu lampu pijar elektrik yang praktis?",
                options: ["Albert Einstein", "Nikola Tesla", "Thomas Edison", "Alexander Graham Bell"],
                answer: 2
            },
            {
                question: "Bahasa pemrograman yang digunakan untuk membuat struktur halaman web adalah...",
                options: ["HTML", "Python", "C++", "Java"],
                answer: 0
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOption = null;
        let isAnswered = false;

        const welcomeScreen = document.getElementById('welcome-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const questionCounter = document.getElementById('question-counter');
        const scoreTracker = document.getElementById('score-tracker');
        const progressBar = document.getElementById('progress-bar');
        const nextBtn = document.getElementById('next-btn');
        const finalScore = document.getElementById('final-score');
        const resultMessage = document.getElementById('result-message');

        function startQuiz() {
            welcomeScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            selectedOption = null;
            nextBtn.disabled = true;
            nextBtn.className = "w-full py-3 px-6 bg-gray-200 text-gray-400 font-semibold rounded-xl transition-all cursor-not-allowed";
            nextBtn.innerText = currentQuestionIndex === quizData.length - 1 ? "Selesai" : "Lanjut";

            const currentQ = quizData[currentQuestionIndex];
            questionCounter.innerText = `Pertanyaan ${currentQuestionIndex + 1} dari ${quizData.length}`;
            scoreTracker.innerText = `Skor: ${score}`;
            progressBar.style.width = `${((currentQuestionIndex + 1) / quizData.length) * 100}%`;
            questionText.innerText = currentQ.question;

            optionsContainer.innerHTML = "";
            currentQ.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border border-gray-200 hover:border-indigo-500 hover:bg-indigo-50 font-medium text-gray-700 transition-all focus:outline-none";
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(index, buttonElement) {
            if (isAnswered) return;
            isAnswered = true;

            const currentQ = quizData[currentQuestionIndex];
            const allButtons = optionsContainer.children;

            if (index === currentQ.answer) {
                buttonElement.className = "w-full text-left p-4 rounded-xl border border-green-500 bg-green-50 font-semibold text-green-700 transition-all";
                score += 20;
                scoreTracker.innerText = `Skor: ${score}`;
            } else {
                buttonElement.className = "w-full text-left p-4 rounded-xl border border-red-500 bg-red-50 font-semibold text-red-700 transition-all";
                allButtons[currentQ.answer].className = "w-full text-left p-4 rounded-xl border border-green-500 bg-green-50 font-semibold text-green-700 transition-all";
            }

            // Disable all buttons after choice
            for (let btn of allButtons) {
                btn.style.cursor = "default";
            }

            nextBtn.disabled = false;
            nextBtn.className = "w-full py-3 px-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg transition-transform transform active:scale-95 cursor-pointer";
        }

        function nextQuestion() {
            if (!isAnswered) return;
            currentQuestionIndex++;

            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            finalScore.innerText = `${score} / 100`;

            if (score === 100) {
                resultMessage.innerText = "Luar biasa! Kamu menjawab semua pertanyaan dengan benar! 🎉";
            } else if (score >= 60) {
                resultMessage.innerText = "Kerja bagus! Pengetahuan umummu cukup luas. 👍";
            } else {
                resultMessage.innerText = "Tetap semangat! Coba lagi untuk mendapatkan skor lebih tinggi. 💪";
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            resultScreen.classList.add('hidden');
            welcomeScreen.classList.remove('hidden');
        }
    </script>

</body>
</html>
